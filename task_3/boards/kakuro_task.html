<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kakuro 9×9</title>
    <style>
      :root {
        --size: 64px;
        --border: 2px solid #111;
        --clue-bg: #d9d9d9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 24px;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #fff;
        color: #111;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .legend {
        margin-bottom: 18px;
        font-size: 14px;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(9, var(--size));
        grid-template-rows: repeat(9, var(--size));
        width: fit-content;
        border-left: var(--border);
        border-top: var(--border);
      }
      .kcell {
        width: var(--size);
        height: var(--size);
        border-right: var(--border);
        border-bottom: var(--border);
        position: relative;
      }
      .white {
        background: #fff;
        display: grid;
        place-items: center;
      }
      .white input {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        text-align: center;
        font-size: 28px;
        background: transparent;
      }
      .block,
      .clue {
        background: var(--clue-bg);
      }
      .clue::after,
      .block.diagonal::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top right,
          transparent calc(50% - 1px),
          #111 calc(50% - 1px),
          #111 calc(50% + 1px),
          transparent calc(50% + 1px)
        );
        pointer-events: none;
      }
      /* Image diagonal runs top-left -> bottom-right.
     CSS gradient above draws the same divider visually. */
      .down {
        position: absolute;
        left: 8px;
        bottom: 7px;
        font-weight: 700;
        font-size: 17px;
        z-index: 1;
      }
      .across {
        position: absolute;
        right: 8px;
        top: 7px;
        font-weight: 700;
        font-size: 17px;
        z-index: 1;
      }
      .coords {
        margin-top: 16px;
        font:
          13px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <h1>Kakuro 9×9</h1>
    <div class="legend">
      Clue góc trên-phải = <b>A</b> (sang phải) - clue góc dưới-trái =
      <b>D</b> (đi xuống). Ô trắng có thể nhập trực tiếp.
    </div>

    <div id="board" class="board"></div>

    <script>
      const grid = [
        [
          { kind: "block" },
          { kind: "block" },
          { kind: "clue", down: 44 },
          { kind: "clue", down: 16 },
          { kind: "clue", down: 9 },
          { kind: "block" },
          { kind: "clue", down: 15 },
          { kind: "clue", down: 44 },
          { kind: "block" },
        ],
        [
          { kind: "block" },
          { kind: "clue", across: 22 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "clue", down: 11, across: 3 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "clue", down: 14 },
        ],
        [
          { kind: "block" },
          { kind: "clue", down: 17, across: 28 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
        ],
        [
          { kind: "clue", across: 14 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "block" },
          { kind: "clue", down: 12, across: 20 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
        ],
        [
          { kind: "clue", across: 17 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "clue", down: 29, across: 22 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "clue", down: 7 },
        ],
        [
          { kind: "block" },
          { kind: "clue", down: 12, across: 28 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "clue", across: 12 },
          { kind: "cell" },
          { kind: "cell" },
        ],
        [
          { kind: "clue", across: 14 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "clue", down: 7 },
          { kind: "clue", down: 12, across: 6 },
          { kind: "cell" },
          { kind: "cell" },
        ],
        [
          { kind: "clue", across: 39 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "block" },
        ],
        [
          { kind: "block" },
          { kind: "clue", across: 16 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "clue", across: 8 },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "cell" },
          { kind: "block" },
        ],
      ];

      const board = document.getElementById("board");

      grid.forEach((row, r) => {
        row.forEach((cell, c) => {
          const el = document.createElement("div");
          el.className = "kcell";

          if (cell.kind === "cell") {
            el.classList.add("white");
            const input = document.createElement("input");
            input.maxLength = 1;
            input.inputMode = "numeric";
            input.dataset.row = r + 1;
            input.dataset.col = c + 1;
            input.addEventListener("input", () => {
              input.value = input.value.replace(/[^1-9]/g, "").slice(0, 1);
            });
            el.appendChild(input);
          } else if (cell.kind === "clue") {
            el.classList.add("clue");
            if (cell.down !== undefined) {
              const d = document.createElement("span");
              d.className = "down";
              d.textContent = cell.down;
              el.appendChild(d);
            }
            if (cell.across !== undefined) {
              const a = document.createElement("span");
              a.className = "across";
              a.textContent = cell.across;
              el.appendChild(a);
            }
          } else {
            el.classList.add("block", "diagonal");
          }

          el.title = `R${r + 1}C${c + 1}`;
          board.appendChild(el);
        });
      });
    </script>
  </body>
</html>
